apiVersion: apps/v1
kind: Deployment
metadata:
  name: visor
  labels:
    app: visor
spec:
  replicas: 1
  selector:
    matchLabels:
      app: visor
  template:
    metadata:
      labels:
        app: visor
    spec:
      containers:
        - name: visor
          image: localhost:32000/visor:latest
          ports:
            - containerPort: 80
        - name: bridge
          image: localhost:32000/bridge:latest
          ports:
              - containerPort: 8080
          envFrom:
            - configMapRef:
                name: rabbit-mq-configmap
            - configMapRef:
                name: broker-topic-config
          env:
            - name: RABBITMQ_USER
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-default-user
                  key: username
            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-default-user
                  key: password
---
apiVersion: v1
kind: Service
metadata:
  name: visor-service
spec:
  selector:
    app: visor
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
  type: LoadBalancer
