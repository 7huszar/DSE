apiVersion: apps/v1
kind: Deployment
metadata:
  name: visor
  labels:
    app: visor
spec:
  replicas: 2
  selector:
    matchLabels:
      app: visor
  template:
    metadata:
      labels:
        app: visor
    spec:
      containers:
        - name: visor
          image: localhost:32000/visor:latest
          ports:
            - containerPort: 80
          resources:
            requests:
              memory: "64Mi"
              cpu: "100m"
            limits:
              memory: "128Mi"
              cpu: "200m"
---
apiVersion: v1
kind: Service
metadata:
  name: visor-service
spec:
  selector:
    app: visor
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
  type: NodePort