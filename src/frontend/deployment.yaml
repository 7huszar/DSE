apiVersion: apps/v1
kind: Deployment
metadata:
  name: visor
  labels:
    app: visor
spec:
  replicas: 1
  selector:
    matchLabels:
      app: visor
  template:
    metadata:
      labels:
        app: visor
    spec:
      containers:
        - name: visor
          image: localhost:32000/visor:latest     # same image, now contains bridge code
          ports:
            - containerPort: 80
          env:
            - name: BROKER_EXCHANGE
              value: "broker"
            - name: VISOR_LOCATION
              value: "visor.location"
            - name: VISOR_DISTANCE
              value: "visor.distance"
          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: visor-service
spec:
  selector:
    app: visor
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
  type: LoadBalancer
