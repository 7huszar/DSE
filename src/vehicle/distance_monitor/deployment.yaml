apiVersion: apps/v1
kind: Deployment
metadata:
  name: distance-monitor-${VIN_LOWER}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: distance-monitor-${VIN_LOWER}
  template:
    metadata:
      labels:
        app: distance-monitor-${VIN_LOWER}
    spec:
      containers:
        - name: distance-monitor
          image: localhost:32000/distance-monitor:latest
          env:
            - name: VIN
              value: "${VIN}"
            - name: RABBITMQ_USER
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-default-user
                  key: username
            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-default-user
                  key: password
            - name: RABBITMQ_HOST
              value: "rabbitmq"
            - name: RABBITMQ_PORT
              value: "5672"