apiVersion: apps/v1
kind: Deployment
metadata:
  name: distance-monitor-${VIN_LOWER}-${SERVICE_DEPLOYMENT_LOCATION}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: distance-monitor
  template:
    metadata:
      labels:
        app: distance-monitor
        vin: ${VIN_LOWER}
        location: ${SERVICE_DEPLOYMENT_LOCATION}
    spec:
      containers:
        - name: distance-monitor
          image: localhost:32000/distance-monitor:latest
          env:
            - name: VIN
              value: "${VIN}"
            - name: SERVICE_DEPLOYMENT_LOCATION
              value: "${SERVICE_DEPLOYMENT_LOCATION}"
            - name: EMERGENCY_BRAKE_BASE_URI
              value: "http://emergency-brake-{vin}/trigger"
            - name: CENTRAL_DIRECTOR_URI
              value: "http://central-director-service/emergency"
            - name: RABBITMQ_USER
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-default-user
                  key: username
            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-default-user
                  key: password
            - name: RABBITMQ_HOST
              value: "rabbitmq"
            - name: RABBITMQ_PORT
              value: "5672"