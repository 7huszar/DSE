apiVersion: apps/v1
kind: Deployment
metadata:
  name: distance-monitor-${VIN_LOWER}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: distance-monitor
  template:
    metadata:
      labels:
        app: distance-monitor
    spec:
      containers:
        - name: distance-monitor
          image: localhost:32000/distance-monitor:latest
          ports:
            - containerPort: 5000
          envFrom:
            - configMapRef:
                name: rabbit-mq-configmap
            - configMapRef:
                name: location-tracker-configmap
          env:
            - name: RABBITMQ_USER
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-default-user
                  key: username
            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-default-user
                  key: password
            - name: RABBITMQ_HOST
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-default-user
                  key: host
            - name: RABBITMQ_PORT
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-default-user
                  key: port
            - name: FLASK_HOST
              valueFrom:
                configMapKeyRef:
                  key: flask_host
                  name: distance-monitor-config
            - name: FLASK_PORT
              valueFrom:
                configMapKeyRef:
                  key: flask_port
                  name: distance-monitor-config