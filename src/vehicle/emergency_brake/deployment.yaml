apiVersion: apps/v1
kind: Deployment
metadata:
  name: emergency-brake-${VIN_LOWER}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: emergency-brake
  template:
    metadata:
      labels:
        app: emergency-brake
        vin: ${VIN_LOWER}
    spec:
      containers:
        - name: emergency-brake
          image: localhost:32000/emergency-brake:latest
          env:
            - name: RABBITMQ_USER
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-default-user
                  key: username
            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-default-user
                  key: password
            - name: RABBITMQ_HOST
              value: "rabbitmq"
            - name: RABBITMQ_PORT
              value: "5672"
            - name: "VIN"
              value: ${VIN}