apiVersion: apps/v1
kind: Deployment
metadata:
  name: data-mock
spec:
  replicas: 1
  selector:
    matchLabels:
      app: data-mock
  template:
    metadata:
      labels:
        app: data-mock
    spec:
      containers:
        - name: data-mock
          image: localhost:32000/data-mock:latest
          ports:
            - containerPort: 80
          env:
            - name: MAX_DST_FRONT
              valueFrom:
                configMapKeyRef:
                  key: max_dst_front
                  name: data-mock-config
            - name: MIN_DST_FRONT
              valueFrom:
                configMapKeyRef:
                  key: min_dst_front
                  name: data-mock-config
            - name: MAX_DST_BACK
              valueFrom:
                configMapKeyRef:
                  key: max_dst_back
                  name: data-mock-config
            - name: MIN_DST_BACK
              valueFrom:
                configMapKeyRef:
                  key: min_dst_back
                  name: data-mock-config
            - name: SAMPLING_TIME
              valueFrom:
                configMapKeyRef:
                  key: sampling_time
                  name: data-mock-config
            - name: SCENARIO
              valueFrom:
                configMapKeyRef:
                  key: scenario
                  name: data-mock-config