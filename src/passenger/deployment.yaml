apiVersion: apps/v1
kind: Deployment
metadata:
  name: passenger
  labels:
    app: passenger
spec:
  replicas: 1
  selector:
    matchLabels:
      app: passenger
  template:
    metadata:
      labels:
        app: passenger
    spec:
      containers:
        - name: passenger
          image: localhost:32000/passenger:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: rabbit-mq-configmap # Provides RABBITMQ_HOST, RABBITMQ_PORT
          env:
            - name: RABBITMQ_USER
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-default-user # Name of the Secret for RabbitMQ username
                  key: username              # Key in the Secret for the username
            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-default-user # Name of the Secret for RabbitMQ password
                  key: password              # Key in the Secret for the password
---
apiVersion: v1
kind: Service
metadata:
  name: passenger-service
  labels:
    app: passenger
spec:
  selector:
    app: passenger
  ports:
    - name: http
      protocol: TCP
      port: 8080
      targetPort: 8080
  type: ClusterIP