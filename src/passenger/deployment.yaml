apiVersion: apps/v1
kind: Deployment
metadata:
  name: passenger
spec:
  replicas: 1
  selector:
    matchLabels:
      app: passenger
  template:
    metadata:
      labels:
        app: passenger
    spec:
      containers:
        - name: passenger
          image: localhost:32000/passenger:latest # Make sure this image name is correct
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          envFrom: # Use ConfigMap for RabbitMQ credentials
            - configMapRef:
                name: rabbit-mq-configmap
---
apiVersion: v1
kind: Service
metadata:
  name: passenger-service
spec:
  selector:
    app: passenger
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
  type: ClusterIP