apiVersion: apps/v1
kind: Deployment
metadata:
  name: passenger
spec:
  replicas: 1
  selector:
    matchLabels:
      app: passenger
  template:
    metadata:
      labels:
        app: passenger
    spec:
      containers:
        - name: passenger
          image: localhost:32000/passenger:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: RABBITMQ_USER
              value: "dse"
            - name: RABBITMQ_PASSWORD
              value: "dse123"
            - name: RABBITMQ_PORT
              value: "5672"
---
apiVersion: v1
kind: Service
metadata:
  name: passenger-service
spec:
  selector:
    app: passenger
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
  type: ClusterIP