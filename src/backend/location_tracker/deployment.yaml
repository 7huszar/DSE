apiVersion: apps/v1
kind: Deployment
metadata:
  name: location-tracker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: location-tracker
  template:
    metadata:
      labels:
        app: location-tracker
    spec:
      containers:
        - name: location-tracker
          image: localhost:32000/location-tracker:latest
          ports:
            - containerPort: 5000
          envFrom:
            - configMapRef:
                name: rabbit-mq-configmap
            - configMapRef:
                name: location-tracker-configmap



