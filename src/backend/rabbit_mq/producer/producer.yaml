apiVersion: apps/v1
kind: Deployment
metadata:
  name: producer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: producer
  template:
    metadata:
      labels:
        app: producer
    spec:
      containers:
        - name: producer
          image: localhost:32000/producer:latest
          ports:
            - containerPort: 5672
          envFrom:
            - configMapRef:
                name: rabbit-mq-configmap
