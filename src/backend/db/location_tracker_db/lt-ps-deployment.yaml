apiVersion: apps/v1
kind: Deployment
metadata:
  name: lt-postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: lt-postgres
  template:
    metadata:
      labels:
        app: lt-postgres
    spec:
      containers:
        - name: postgres
          image: 'postgres:14'
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5432
          envFrom:
            - configMapRef:
                name: lt-postgres-secret
          volumeMounts:
            - mountPath: /var/lib/lt-postgres/data
              name: lt-postgresdata
      volumes:
        - name: lt-postgresdata
          persistentVolumeClaim:
            claimName: lt-postgres-volume-claim